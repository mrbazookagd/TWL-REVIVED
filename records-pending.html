<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PENDING RECORD SUBMISSIONS</title>
    <link rel="icon" type="image/png" href="logo.ico">
</head>
    <link rel="stylesheet" href="style.css">
    <style>
        .sub-layout { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .page-header { text-align: center; margin-bottom: 40px; }
        .sub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .record-card { background: rgba(20, 22, 30, 0.8); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 12px; }
        .rec-title { font-size: 1.35rem; font-weight: 800; margin: 0; color: #fff; }
        .rec-user { font-size: 0.9rem; color: var(--accent, #47e5bc); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .notes-box { font-size: 0.8rem; color: #aaa; background: rgba(255,255,255,0.02); padding: 10px; border-radius: 6px; border-left: 3px solid #444; }
        .action-link { display: block; text-align: center; background: #fff; color: #000; padding: 10px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; text-decoration: none; margin-top: auto; }
        #loading { text-align: center; color: #666; font-size: 1.2rem; padding: 40px; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo" onclick="window.location.href='index.html'" style="cursor:pointer;">THE WAVE LIST</div>
        <div>
            <a href="index.html" class="nav-link" style="margin-right: 20px;">BACK TO LIST</a>
            <a href="submit.html" class="nav-link">SUBMIT MENU</a>
        </div>
    </nav>

    <div class="sub-layout">
        <div class="page-header">
            <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 5px;">PENDING USER RECORDS</h1>
            <p style="color: #666; text-transform: uppercase; letter-spacing: 2px; font-size: 0.9rem;">Player run completions cue</p>
        </div>
        <div id="loading">Loading current run submissions...</div>
        <div class="sub-grid" id="recordsGrid"></div>
    </div>

    <script>
        const GITHUB_USER = "jokewreb";
        const GITHUB_REPO = "TWL";

        async function fetchRecords() {
            const grid = document.getElementById('recordsGrid');
            const loading = document.getElementById('loading');
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues?state=open&per_page=100`);
                const issues = await response.json();
                
                const filtered = issues.filter(i => i.title && i.title.startsWith('[RECORD]'));
                loading.style.display = 'none';
                
                if (filtered.length === 0) {
                    grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#444; padding:40px;">No pending player records found.</div>`;
                    return;
                }

                filtered.forEach(issue => {
                    const data = {};
                    if (issue.body) {
                        issue.body.split('\n').forEach(line => {
                            const parts = line.split(': ');
                            if (parts.length >= 2) {
                                data[parts[0].trim()] = parts.slice(1).join(': ').trim();
                            }
                        });
                    }

                    const card = document.createElement('div');
                    card.className = 'record-card';
                    card.innerHTML = `
                        <div>
                            <div class="rec-user">🏃 Player: ${data["SUBMIT USERNAME"] || "Unknown"}</div>
                            <h3 class="rec-title">${data["LEVEL NAME"] || "Unknown Level"}</h3>
                        </div>
                        <div class="notes-box">
                            <span style="font-size:0.65rem; font-weight:700; color:#666; display:block; text-transform:uppercase; margin-bottom:2px;">Extra Notes</span>
                            ${data["EXTRA NOTES"] || "None"}
                        </div>
                        <a href="${data["VIDEO LINK"] || '#'}" target="_blank" class="action-link">Watch Proof Video</a>
                    `;
                    grid.appendChild(card);
                });
            } catch(e) {
                loading.innerText = "Error pulling data lists.";
            }
        }
        fetchRecords();
    </script>
</body>
</html>
